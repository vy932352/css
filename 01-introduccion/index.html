<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introducción a css</title>
</head>
<body>
   <!--CSS dentro del elemento llamado <style>...</style>-->

   <style>
      
        h1 {
         color: yellow;
         font-size: 67px;
       }

    </style>

    <h1>Introducción a CSS</h1>

<!-- css se escribe en lineas dentro de la etiqueta de apertura de un elemento de html-->

    <p style="color:cyan; font-size:18px">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Odio consectetur nesciunt dignissimos. Maiores, eius laborum quibusdam harum aliquam vel, similique, assumenda ducimus optio illo placeat totam porro adipisci dolorem nihil.</p>

    <!-- se escribe css en un documento externo y se enlaza a traves de un elemento <link> -->

<h2> css externo </h2>
<link rel="stylesheet" href="./style.css"

</body>
</html>
